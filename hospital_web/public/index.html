<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="LifeLink — Real-time emergency blood donor matching platform for hospitals and donors." />
    <meta name="theme-color" content="#ff2d55" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LifeLink" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#ff2d55" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Security: Content Security Policy -->
        <meta http-equiv="Content-Security-Policy" content="
          default-src 'self';
          script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com;
          font-src 'self' https://fonts.gstatic.com data:;
          img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org;
          connect-src 'self' https://hqdiqjswknukqyghtgsa.supabase.co wss://hqdiqjswknukqyghtgsa.supabase.co https://*.basemaps.cartocdn.com;
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self';
        ">
    
    <!-- Permissions Policy -->
    <meta http-equiv="Permissions-Policy" content="
      geolocation=(self),
      camera=(),
      microphone=(),
      payment=(),
      usb=(),
      magnetometer=(),
      gyroscope=(),
      accelerometer=()
    ">
    
    <title>LifeLink — Emergency Blood Network</title>

    <!-- Preconnect for critical third-party origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://hqdiqjswknukqyghtgsa.supabase.co" crossorigin />
    
    <!-- DNS prefetch for faster connections -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://hqdiqjswknukqyghtgsa.supabase.co" />

    <!-- Google Fonts: Inter for body -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" /></noscript>

    <!-- App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#ff2d55" />

    <!-- Cross-browser CSS reset & compatibility -->
    <style>
      /* CSS Custom Properties fallback for older browsers */
      :root {
        --primary: #ff2d55;
        --primary-dark: #c02444;
        --primary-light: #ff6b8a;
        --bg-app: #0d0d0d;
        --bg-card: rgba(22, 22, 22, 0.95);
        --bg-hover: rgba(255, 255, 255, 0.05);
        --text-main: #f5f5f5;
        --text-muted: #a0a0a0;
        --border-soft: rgba(255, 255, 255, 0.08);
        --accent-red: #ff2d55;
        --accent-blue: #007aff;
        --accent-green: #34c759;
        --accent-orange: #ff9f0a;
        --glass-bg: rgba(255, 255, 255, 0.04);
        --glass-border: rgba(255, 255, 255, 0.1);
        --glass-blur: blur(16px);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.15);
        --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.25);
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --radius-xl: 24px;
        --transition-fast: 150ms ease;
        --transition-normal: 250ms ease;
        --transition-slow: 350ms ease;
      }

      /* Cross-browser box-sizing */
      *, *::before, *::after { 
        box-sizing: border-box; 
      }

      /* Font smoothing - cross-browser */
      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* Base styles */
      body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: var(--bg-app);
        color: var(--text-main);
        line-height: 1.6;
        min-height: 100vh;
      }

      /* Focus styles - accessible across all browsers */
      :focus-visible {
        outline: 2px solid var(--accent-red);
        outline-offset: 2px;
      }
      
      /* Remove focus outline for mouse users (Edge/Chrome/Brave) */
      :focus:not(:focus-visible) {
        outline: none;
      }

      /* Input/Select/Button inherit font */
      input, select, button, textarea {
        font-family: inherit;
        font-size: inherit;
      }

      /* Scrollbar styling - WebKit (Chrome, Edge, Brave, Safari) */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
        background-clip: content-box;
      }

      /* Firefox scrollbar */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
      }

      /* Selection styling */
      ::selection {
        background: var(--accent-red);
        color: white;
      }
      ::-moz-selection {
        background: var(--accent-red);
        color: white;
      }

      /* Reduced motion support */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* High contrast mode support */
      @media (prefers-contrast: high) {
        :root {
          --border-soft: rgba(255, 255, 255, 0.3);
          --text-muted: #cccccc;
        }
      }

      /* Print styles */
      @media print {
        .no-print { display: none !important; }
        body { background: white !important; color: black !important; }
      }

      /* Utility classes */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Service Worker Registration (for offline support & push notifications) -->
    <script>
      // Register service worker for offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('[SW] Service Worker registered with scope:', registration.scope);
              
              // Check for updates
              registration.addEventListener('updatefound', function() {
                const newWorker = registration.installing;
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[SW] New version available');
                    // Could show update notification here
                  }
                });
              });
            })
            .catch(function(error) {
              console.error('[SW] Service Worker registration failed:', error);
            });
        });

        // Handle messages from service worker
        navigator.serviceWorker.addEventListener('message', function(event) {
          if (event.data && event.data.type === 'SW_UPDATED') {
            console.log('[SW] App updated, reloading...');
            window.location.reload();
          }
        });
      }

      // Prevent pinch zoom on double tap (iOS Safari fix)
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(event) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });

      // Handle online/offline events
      window.addEventListener('online', function() {
        document.body.classList.remove('offline');
        console.log('[App] Online');
      });
      window.addEventListener('offline', function() {
        document.body.classList.add('offline');
        console.log('[App] Offline');
      });
    </script>
  </body>
</html>
